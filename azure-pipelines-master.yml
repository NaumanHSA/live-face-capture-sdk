resources:
  repositories:
    - repository: repo1
      type: git
      name: Live-Face-Capture-SDK
      ref: master

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  workspace: '$(Pipeline.Workspace)'

trigger:
  - master
  - main

pr:
  branches:
    include:
      - master
      - main

pool:
  name: Devsecops

steps:

- script: |
    curl -H "Content-Type: application/json" \
      -d "{\"text\": \"CI started: Live-Face-Capture-SDK @ $(Build.SourceBranchName) ($(Build.Reason))\"}" \
      "$(teamsWebhookUrl)"
  displayName: 'Notify: CI started'

- task: NodeTool@0
  inputs:
    versionSpec: '20.17.0'
  displayName: 'Install Node.js'

- script: npm ci
  displayName: 'Install dependencies (npm ci)'

# ── Quality gates ────────────────────────────────────────────────────────────

- script: npm test
  displayName: 'Run unit tests (Vitest)'

- script: npm run build
  displayName: 'Build SDK (Rollup)'

- script: |
    curl -H "Content-Type: application/json" \
      -d "{\"text\": \"✅ Tests + build passed: Live-Face-Capture-SDK @ $(Build.SourceBranchName)\"}" \
      "$(teamsWebhookUrl)"
  displayName: 'Notify: Tests + build passed'

# ── Artefacts ────────────────────────────────────────────────────────────────

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: './dist'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/Live-Face-Capture-SDK-$(Build.BuildId).zip'
    replaceExistingArchive: false
    verbose: true
  displayName: 'Archive dist/'

- task: CopyFiles@2
  inputs:
    contents: '$(Build.ArtifactStagingDirectory)/Live-Face-Capture-SDK-$(Build.BuildId).zip'
    targetFolder: '$(Build.ArtifactStagingDirectory)'
  displayName: 'Stage artefact'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish artefact'

- script: |
    curl -H "Content-Type: application/json" \
      -d "{\"text\": \"📦 Artefact published: Live-Face-Capture-SDK @ $(Build.SourceBranchName)\"}" \
      "$(teamsWebhookUrl)"
  displayName: 'Notify: Artefact published'

# ── Version extraction ───────────────────────────────────────────────────────

- task: Bash@3
  displayName: 'Extract release version from history file'
  inputs:
    targetType: 'inline'
    script: |
      RELEASE_FILE="$(Pipeline.Workspace)/s/_ReleaseHistory_LiveFaceCapture_Web.MD"
      LATEST_VERSION=$(grep -m 1 -oP '(?<=Version \*\*)[0-9]+\.[0-9]+\.[0-9]+' "$RELEASE_FILE")
      echo "##vso[task.setvariable variable=LatestReleaseVersion]$LATEST_VERSION"
      echo "Latest Release Version: $LATEST_VERSION"

# ── Docker ───────────────────────────────────────────────────────────────────

- task: Docker@2
  displayName: 'Login to Docker registry'
  inputs:
    containerRegistry: 'DevSecOps-docker'
    command: 'login'

- script: |
    export DOCKER_HOST=unix:///var/run/docker.sock
    docker info
  displayName: 'Validate Docker host'

- task: Docker@2
  displayName: 'Build and push Docker image'
  inputs:
    containerRegistry: 'DevSecOps-docker'
    repository: 'Live-Face-Capture-SDK-$(Build.SourceBranchName)'
    command: 'buildAndPush'
    Dockerfile: '$(Pipeline.Workspace)/s/Dockerfile'
    buildContext: '$(Pipeline.Workspace)/s'
    tags: '$(LatestReleaseVersion)'

- script: |
    curl -H "Content-Type: application/json" \
      -d "{\"text\": \"🐳 Docker image pushed: Live-Face-Capture-SDK @ $(Build.SourceBranchName) ($(LatestReleaseVersion))\"}" \
      "$(teamsWebhookUrl)"
  displayName: 'Notify: Docker image pushed'
