<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div id="app-container" class="app-container">
        <div id="loading-screen" class="loading-screen">
            <div class="loading-circle"></div>
            <div id="loading-text" class="loading-text">Preparing camera...</div>
        </div>
        <button id="btn-close" class="btn-close bi bi-x-lg"></button>
        <div id="video-container" class="video-container">
            <video id="video" class="camera-view" autoplay muted playsinline></video>
            <canvas id="visCanvas" class="canvas"></canvas>
            <canvas id="holeCanvas" class="canvas" data-lfc="holeCanvas"></canvas>
        </div>
    </div>
</body>

</html>
