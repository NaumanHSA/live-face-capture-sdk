<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!-- Include MediaPipe scripts -->
    <div id="app-container" style="width: 100%; background-color: white;"
        class="app-container container col-12 col-sm-8 col-md-7 col-lg-6 col-xl-4 d-flex flex-column align-items-center justify-content-between ">
        <div id="loading-screen" class="loading-screen">
            <div class="loading-circle"></div>
            <div class="mt-2" style="color: white;">Loading...</div>
        </div>
        <div class="row pt-2 pl-4 pb-2 mb-2 shadow" style="width: 100%; height: 12%; background-color: white; overflow: hidden; z-index: 1;">
            <div class="col">
                <img src="https://home.moi.gov.ae/moi/assets/img/svg-icons/uae-minstry-logo.svg" style="height: 100%; object-fit: contain; overflow: hidden;" />
            </div>
        </div>
        <div id="video-container" class="p-0" style="width: 100%; height: 83%; position: relative; overflow: hidden;">
            <video id="video" class="camera-view p-0" autoplay muted></video>
            <canvas id="visCanvas" class="canvas p-0"></canvas>
            <canvas id="holeCanvas" class="canvas p-0"></canvas>
        </div>
        <div class="row" style="width: 100%; height: 5%; background-color: #b68a35; overflow: hidden;"></div>
    </div>
</body>

</html>
